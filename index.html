<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Stockifly...</title>
  <link rel="canonical" href="https://stockifly.pages.dev/">
  
  <!-- Instant Meta Refresh -->
  <meta http-equiv="refresh" content="0; url=https://stockifly.pages.dev/">

  <!-- Instant JavaScript Redirect with Full Query & Hash Preservation -->
  <script>
    (function() {
      var targetBase = "https://stockifly.pages.dev/";
      var targetUrl = targetBase + window.location.search + window.location.hash;
      try {
        window.location.replace(targetUrl);
      } catch (e) {
        window.location.href = targetUrl;
      }
    })();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .redirect-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(245, 158, 11, 0.15);
    }
    .spinner {
      width: 56px;
      height: 56px;
      border: 4px solid rgba(245, 158, 11, 0.2);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .brand {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .brand span {
      color: #f59e0b;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0f172a;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 12px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
      width: 100%;
    }
    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
    }
    .cta-btn:active {
      transform: translateY(0);
    }
    .footnote {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }
    .footnote a {
      color: #38bdf8;
      text-decoration: none;
    }
    .footnote a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="spinner"></div>
    <div class="brand">STOCKI<span>FLY</span></div>
    <div class="status-badge">Server Upgraded</div>
    <p>Stockifly has moved to our high-speed Cloudflare production cloud. You are being redirected automatically...</p>
    <a id="redirectBtn" href="https://stockifly.pages.dev/" class="cta-btn">
      <span>🚀 Open Stockifly Now</span>
    </a>
    <div class="footnote">
      New URL: <a id="destUrl" href="https://stockifly.pages.dev/">https://stockifly.pages.dev</a>
    </div>
  </div>

  <script>
    // Update button link dynamically to carry query/hash params if clicked manually
    (function() {
      var dest = "https://stockifly.pages.dev/" + window.location.search + window.location.hash;
      var btn = document.getElementById("redirectBtn");
      var link = document.getElementById("destUrl");
      if (btn) btn.href = dest;
      if (link) {
        link.href = dest;
        link.textContent = dest;
      }
      // Fallback timer if browser blocked instant replace
      setTimeout(function() {
        window.location.href = dest;
      }, 1500);
    })();
  </script>
</body>
</html>
